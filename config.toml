# cedar-goto default configuration. Every key below is also the code
# default (src/cedar_goto/config.py) except where noted; see the README for
# what they do.

[mount]
address = "127.0.0.1:11111"
device_number = 0
backend = "mock"              # "alpyca" (real mount) | "indi" (straight to indiserver) | "mock" (simulated-sky harness)
# indi_device_name = "Skywatcher Alt-Az"  # "indi" backend only -- INDI addresses devices
                                          # by name, so device_number is ignored there, and
                                          # `address` is indiserver's own host:port (:7624).

# cedar-server serves gRPC on the same port as its web UI (tonic's
# GrpcWebLayer combines them) -- default 80, not a dedicated gRPC port.
[cedar]
address = "127.0.0.1:80"
backend = "mock"              # "grpc" (real cedar-server) | "mock" (simulated solves).
                              # Independent of [mount].backend -- switch to "grpc" once
                              # cedar-server is reachable at the address above.

# Defaults are the ASCOM well-known ports, which cedar-server's own Alpaca
# server also uses -- see "Port conflict with cedar-server's own Alpaca
# server" in the README if cedar-goto is running on the same host.
[server]
bind = "0.0.0.0"
alpaca_port = 11111
discovery = true

# Only used by the mock backend (a real mount reports its own site) --
# some Alpaca clients treat 0,0 as "unconfigured" and disable GoTo.
# Defaulted to the Cedar-Box's observer_location seen during testing.
[site]
latitude_deg = 50.719156642083021
longitude_deg = 3.9394812552330514
elevation_m = 0.0

[loop]
tolerance_arcmin = 1.0        # "min_move": stop nudging once measured error is under this
# max_correction_arcmin = 30.0  # "max_move": refuse to auto-nudge above this (uncomment once tuned on-sky)
max_iterations = 3
settle_ms = 1500
correction_enabled = true     # starting state of the dashboard's auto-correction toggle;
                              # off = SlewToCoordinates is a bare proxy (no cedar nudging)

[solve]
min_matches = 10
max_prob_false_positive = 1e-3
max_p90_error_arcsec = 30
reject_imu = true

[position]
source = "cedar_fallback_mount"   # "cedar" | "mount" | "cedar_fallback_mount"
max_solve_age_s = 5.0

[buzzer]
enabled = false
gpio_pin = 18
pattern = "success"
