# Real-hardware(-ish) test config: cedar-goto's mount client (alpyca)
# pointed at the official ASCOM Remote Server's simulator, with cedar
# mocked out (a MountEchoCedar echoes the real mount's own position as
# ground truth -- no real cedar-server solving needed to exercise the real
# mount plumbing).
# device_number: 0 = "Telescope Simulator for .NET", 1 = "ASCOM OmniSim
# Telescope", 2 = "Simulator".

[mount]
address = "192.168.1.50:11111"     # your ASCOM Remote Server host:port
device_number = 0
backend = "alpyca"

[cedar]
backend = "mock"

# Well-known ASCOM defaults -- fine on a bench host, but they collide with
# cedar-server's own Alpaca server (see the README's port-conflict section)
# if cedar-goto runs on the same box. The remote simulator's own :11111
# above is a different host, so it doesn't conflict.
[server]
bind = "0.0.0.0"
alpaca_port = 11111
discovery = true

[solve]
min_matches = 10
max_prob_false_positive = 1e-3
max_p90_error_arcsec = 30
reject_imu = true

[position]
source = "cedar_fallback_mount"
max_solve_age_s = 5.0
