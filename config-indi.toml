# Real-hardware test config: cedar-goto's mount client talking straight to
# indiserver (indi-refactor.md), bypassing indi_alpaca_server's stale
# property snapshot bug. cedar mocked out (a MountEchoCedar echoes the real
# mount's own position as ground truth -- no real cedar-server solving
# needed to exercise the real mount plumbing). See indi-refactor.md.

[mount]
address = "mount.local:7624"       # your indiserver host:port
backend = "indi"
indi_device_name = "Skywatcher Alt-Az"

[cedar]
backend = "mock"

[server]
bind = "0.0.0.0"
alpaca_port = 11111
discovery = true

[loop]
tolerance_arcmin = 1.0
# max_correction_arcmin = 30.0
max_iterations = 3
settle_ms = 1500

[solve]
min_matches = 10
max_prob_false_positive = 1e-3
max_p90_error_arcsec = 30
reject_imu = true

[position]
source = "cedar_fallback_mount"
max_solve_age_s = 5.0

[buzzer]
enabled = false
